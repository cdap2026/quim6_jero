        let currentQuestion = 0;
        let userAnswers = new Array(10).fill(null);
        let timeLeft = 45 * 60; // 45 minutes
        let timerInterval;
        let studentName = '';

        function startExam() {
            const nameInput = document.getElementById('student-name').value.trim();
            if(!nameInput) {
                alert('Por favor, escribe tu nombre antes de comenzar.');
                return;
            }
            studentName = nameInput;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            
            renderQuestions();
            showQuestion(0);
            
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishExam();
                return;
            }
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = `question-card ${index === 0 ? 'active' : ''}`;
                qDiv.id = `q-${index}`;
                
                let html = `
                    <h2 class="text-2xl font-bold mb-4">${q.text}</h2>
                    <div class="img-container mb-6 bg-white p-2 rounded-lg border-2 border-gray-200 text-center">
                        <img src="${q.image}" alt="Imagen ilustrativa" onerror="this.style.display='none';">
                    </div>
                `;
                
                if (q.type === 'closed') {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                    q.options.forEach((opt, optIdx) => {
                        html += `
                            <button onclick="selectOption(${index}, ${optIdx})" id="btn-opt-${index}-${optIdx}" class="option-btn bg-white border-2 border-gray-300 text-gray-800 text-xl font-semibold py-4 px-6 rounded-xl hover:bg-blue-50 text-left flex items-center">
                                <span class="bg-gray-200 rounded-full w-8 h-8 inline-flex items-center justify-center mr-4">${String.fromCharCode(65+optIdx)}</span>
                                ${opt}
                            </button>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `
                        <textarea id="open-ans-${index}" onchange="saveOpenAnswer(${index})" class="w-full h-40 p-4 border-2 border-gray-300 rounded-lg text-xl" placeholder="Escribe tu respuesta de forma clara aquí..."></textarea>
                    `;
                }
                
                qDiv.innerHTML = html;
                container.appendChild(qDiv);
            });
        }

        function selectOption(qIndex, optIndex) {
            userAnswers[qIndex] = optIndex;
            for(let i=0; i<4; i++) {
                let btn = document.getElementById(`btn-opt-${qIndex}-${i}`);
                if(btn) {
                    btn.classList.remove('selected');
                    btn.classList.replace('bg-blue-600', 'bg-white');
                    btn.classList.replace('text-white', 'text-gray-800');
                }
            }
            let selectedBtn = document.getElementById(`btn-opt-${qIndex}-${optIndex}`);
            selectedBtn.classList.add('selected');
        }

        function saveOpenAnswer(qIndex) {
            userAnswers[qIndex] = document.getElementById(`open-ans-${qIndex}`).value;
        }

        function showQuestion(index) {
            document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`q-${index}`).classList.add('active');
            document.getElementById('current-q-num').innerText = index + 1;
            
            document.getElementById('btn-prev').disabled = index === 0;
            
            if(index === questions.length - 1) {
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-finish').classList.remove('hidden');
            } else {
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-finish').classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                if(questions[currentQuestion].type === 'open') saveOpenAnswer(currentQuestion);
                currentQuestion++;
                showQuestion(currentQuestion);
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                if(questions[currentQuestion].type === 'open') saveOpenAnswer(currentQuestion);
                currentQuestion--;
                showQuestion(currentQuestion);
            }
        }

        async function finishExam() {
            clearInterval(timerInterval);
            if(questions[currentQuestion].type === 'open') saveOpenAnswer(currentQuestion);
            
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            await generatePDF();
        }

            doc.setFont("helvetica", "normal");

            y += 10;
            
            let score = 0;
            for(let i=0; i<8; i++) {
                if(userAnswers[i] === questions[i].correct) score++;
            }
            doc.setFont("helvetica", "bold");
            doc.text(`Calificación (Preguntas Cerradas): ${score} / 8 correctas`, 15, y);
            y += 10;

            doc.setFontSize(10);
            for(let i=0; i<questions.length; i++) {
                if(y > 270) {
                    doc.addPage();
                    y = 20;
                }
                
                doc.setFont("helvetica", "bold");
                const qLines = doc.splitTextToSize(questions[i].text, pageWidth - 30);
                doc.text(qLines, 15, y);
                y += (qLines.length * 5) + 2;
                
                doc.setFont("helvetica", "normal");
                if (questions[i].type === 'closed') {
                    const ans = userAnswers[i];
                    const correctAns = questions[i].correct;
                    let ansText = ans !== null ? questions[i].options[ans] : "No respondida";
                    let isCorrect = ans === correctAns ? "Correcto" : `Incorrecto (La correcta era: ${questions[i].options[correctAns]})`;
                    
                    doc.text(`Tu respuesta: ${ansText} - [${isCorrect}]`, 20, y);
                    y += 8;
                } else {
                    const ans = userAnswers[i] || "No respondida";
                    doc.text("Tu respuesta (Abierta):", 20, y);
                    y += 5;
                    const ansLines = doc.splitTextToSize(ans, pageWidth - 40);
                    doc.text(ansLines, 25, y);
                    y += (ansLines.length * 5) + 5;
                }
            }

            doc.save(`Examen_Quimica_${studentName.replace(/\s+/g, '_')}.pdf`);
            document.getElementById('result-screen').innerHTML += '<p class="text-green-600 font-bold text-xl mt-4">¡PDF Generado y descargado exitosamente!</p>';
